releaseNotes: >-
  Adds the NerdAxe family (NerdQAxe+, NerdQAxe++ including rev 7, NerdOCTAXE+, NerdHaxe, NerdAxe,
  Gamma, Gaia, NerdEKO, Q1373) and the Nexus S1. Detect reads each miner's factory defaults, its
  rated input-voltage range, its overheat temperature and its absolute frequency/voltage maximums
  (which the NerdAxe firmware enforces), and sets the limits to match. Miners whose firmware
  doesn't report an error rate are judged on hashrate and rejected shares. Multi-chip boards are
  watched on their hottest chip.
