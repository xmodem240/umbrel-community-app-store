port: 8420
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Live progress, emergency stop and graphs.


  - Sticky live status bar while tuning: heartbeat ("last reading 2s ago"), current point and phase,
    progress bar with countdown, run time and how many points are left at this voltage.

  - One-click EMERGENCY STOP that restores the miner's original settings immediately.

  - "Restore original settings" button when no run is active.

  - Live graphs of hashrate, ASIC/VR temperature and power, split per test point and marked
    stable/unstable, with your safety limits drawn in. Hover any graph to read exact values.

  - Live temperature and power meters against your limits.
submitter: Kyle
