releaseNotes: >-
  New Cooling option (Air / Water). Water cooling raises the frequency ceiling and power limit and
  lengthens the warm-up so the loop's temperature settles. Core voltage stays capped, because the
  ~1,300 mV 24/7 limit is about chip wear rather than heat. The app now warns when a board doesn't
  report voltage-regulator temperature, since water blocks usually don't cool it.


  0.2.3 added 12 V board support (Naja Duo) and raised the max power limit to 400 W.
