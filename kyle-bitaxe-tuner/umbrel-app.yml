releaseNotes: >-
  Limits can now be changed while a test is running (Adjust limits in the status bar, then Apply to
  running test). Temperature, power and input limits apply immediately; hashrate, error and reject
  limits apply when the current point is judged; timings and steps from the next point. Every change
  is written to the log.


  Fix: decimal limits such as a 1.5 % max error rate were being rounded down to whole numbers.
