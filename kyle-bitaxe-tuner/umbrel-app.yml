releaseNotes: >-
  Detect now recognizes your Bitaxe model and fills in its factory settings: the run starts at the
  factory frequency and core voltage, core voltage is capped at the top of the firmware's own
  voltage range, and input-voltage limits follow the board's nominal supply. Defaults come from
  the miner's firmware when it reports them, otherwise from a built-in table of 25 official board
  versions generated from ESP-Miner (Max, Ultra, Supra, Gamma, Gamma Duo, Gamma Turbo, Hex,
  Supra Hex, Gamma Hex, Naja Duo).


  Safety: on two-chip boards (Naja Duo, Gamma Turbo and others) the temperature limit now watches
  the hottest chip instead of only the first, and a run stops if the firmware enters its own
  overheat mode.
