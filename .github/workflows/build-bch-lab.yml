name: Build Bitcoin Cash Lab image
on:
  push:
    branches: [main]
    paths:
      - "bch-lab-src/**"
      - "kyle-bch-lab/umbrel-app.yml"
      - ".github/workflows/build-bch-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bch-lab-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)" >> "$GITHUB_OUTPUT"
          # The image tag is the version in umbrel-app.yml, so it always matches docker-compose.yml.
          v="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' kyle-bch-lab/umbrel-app.yml)"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: bch-lab-src
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/bch-lab:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/bch-lab:latest
