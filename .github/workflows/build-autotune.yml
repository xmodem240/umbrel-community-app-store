name: Build Bitaxe Autotuner image
on:
  push:
    branches: [main]
    paths:
      - "autotune-src/**"
      - "autotune-tests/**"
      - "kyle-bitaxe-autotune/umbrel-app.yml"
      - ".github/workflows/build-autotune.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r autotune-src/requirements.txt
      - run: python -m unittest discover -s autotune-tests -p "test_*.py" -v
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)" >> "$GITHUB_OUTPUT"
          # The image tag is the version in umbrel-app.yml, so it always matches docker-compose.yml.
          v="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' kyle-bitaxe-autotune/umbrel-app.yml)"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: autotune-src
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/bitaxe-autotune:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/bitaxe-autotune:latest
