name: Build image
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "src/**"
      - "kyle-bitaxe-tuner/umbrel-app.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)" >> "$GITHUB_OUTPUT"
          # Tag pushes use the tag (v1.2.3 -> 1.2.3); branch pushes use the version in umbrel-app.yml,
          # so the image tag always matches what docker-compose.yml asks for.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' kyle-bitaxe-tuner/umbrel-app.yml)"
          fi
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/bitaxe-tuner:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/bitaxe-tuner:latest
