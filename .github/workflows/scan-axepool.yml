name: Weekly AxePool vulnerability scan
# Re-scans the released image every week, so a CVE published after a release still
# shows up (as a failed run in the Actions tab). Fix by releasing a rebuilt image.
on:
  schedule:
    - cron: "17 14 * * 1"          # Mondays 14:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)" >> "$GITHUB_OUTPUT"
          v="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' kyle-axepool/umbrel-app.yml)"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Trivy scan of the released image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/axepool:${{ steps.meta.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
