manifestVersion: 1
id: kyle-bch-lab
category: bitcoin
name: Bitcoin Cash Lab
icon: https://raw.githubusercontent.com/xmodem240/umbrel-community-app-store/main/assets/bch-lab-icon.svg
version: "0.7.1"
tagline: See which peers bring your Bitcoin Cash node new blocks first
description: >-
  Your peers decide how soon your Bitcoin Cash node hears about a new block. Bitcoin Cash Lab notes, for every block, which peer delivered it first and ranks your peers by it.


  Pick your node software on the dashboard: the Bitcoin Cash Node app from LoneStrike Labs, the official Umbrel Bitcoin Cash Node app, WillItMod's AxeBCH, or any other BCHN-compatible node. A built-in test tells you whether RPC and ZMQ block notifications work before you save.


  Peer Map shows where your peers are on a world map, who hosts them and what software they run. Everything is looked up inside the app; no peer address leaves your Umbrel.


  Keep the good peers as manual peers (they are put back after a node restart) and, optionally, let a rotation drop peers that never deliver. Inbound peers are ranked too, but never replaced automatically.


  Stratum Race times how quickly each mining pool turns a new block into fresh work: public BCH solo pools, plus a local LoneStrike Cash, AxeBCH or AxePool pool if you run one. It is off until you switch it on.


  For AxeBCH, host, ports and user are built in; you enter its per-install RPC password (the app tells you where to find it). Based on the MIT-licensed Bitcoin Lab and Peer Map by benunskilled. Geolocation by DB-IP.
releaseNotes: >-
  From Peer Lab 1.0.1: a pool app found on your Umbrel (LoneStrike Cash, AxeBCH, AxePool) is marked "✓ found" in Stratum Race and added with one tap. Peers behind Tor, I2P or Docker show that in words on the map instead of the proxy address. Plus a stricter limit on oversized pool messages and a gentler database clean-up.
developer: Kyle
