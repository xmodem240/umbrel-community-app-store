# Bitcoin Cash Lab: one image, four services sharing one SQLite file.
#
# WHICH NODE. The environment below is only the starting point: it points at the
# LoneStrike Labs "Bitcoin Cash Node" app (sslabs-bitcoin-cash-node), whose RPC login and
# container name are fixed in that app's own compose file. Once you choose a node on the
# dashboard's Node card, that choice is saved in /data/node-profile.json and wins over
# these variables; the four services restart themselves when it changes (restart:
# on-failure brings them back). This app declares no Umbrel dependency because either
# node app can serve.
#
# Hardening (read-only root, tmpfs /tmp, no capabilities, no-new-privileges) and the
# heartbeat healthchecks for the three workers that have no HTTP port are carried over
# from the upstream Bitcoin Lab packaging.
#
# IMAGE: built by .github/workflows/build-bch-lab.yml from bch-lab-src/. The GHCR package
# must be set to public once, or Umbrel cannot pull it.

x-node-env: &node-env
  BITCOIN_RPC_HOST: sslabs-bitcoin-cash-node_bitcoind_1
  BITCOIN_RPC_PORT: "8332"
  BITCOIN_RPC_USER: bchn
  BITCOIN_RPC_PASS: bchn_local_rpc_pw_2f9c
  BITCOIN_ZMQ_HOST: sslabs-bitcoin-cash-node_bitcoind_1
  BITCOIN_ZMQ_HASHBLOCK_PORT: "28332"
  BITCOIN_NETWORK: mainnet
  DATA_DIR: /data

x-hardening: &hardening
  image: ghcr.io/xmodem240/bch-lab:0.2.2
  user: "1000:1000"
  init: true
  restart: on-failure
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  volumes:
    - ${APP_DATA_DIR}/data:/data

services:
  app_proxy:
    environment:
      APP_HOST: kyle-bch-lab_dashboard_1
      APP_PORT: 8788

  dashboard:
    <<: *hardening
    command: ["node", "src/dashboard-server.js"]
    environment:
      <<: *node-env
      DASHBOARD_PORT: "8788"
    healthcheck:
      # Double-quoted on purpose: the JS contains ": " which a plain YAML scalar would read as a mapping.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8788/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  peer-profiler:
    <<: *hardening
    command: ["node", "src/peer-profiler.js"]
    environment:
      <<: *node-env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('/app/src/lib/health').assertFresh('peer-profiler', 120000)
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 60s

  relay-profiler:
    <<: *hardening
    command: ["node", "src/relay-profiler.js"]
    environment:
      <<: *node-env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('/app/src/lib/health').assertFresh('relay-profiler', 120000)
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 60s

  stratum-race:
    <<: *hardening
    command: ["node", "src/stratum-race.js"]
    environment:
      <<: *node-env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('/app/src/lib/health').assertFresh('stratum-race', 120000)
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 60s
