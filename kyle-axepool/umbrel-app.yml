manifestVersion: 1
id: kyle-axepool
category: bitcoin
name: AxePool
icon: https://raw.githubusercontent.com/xmodem240/umbrel-community-app-store/main/assets/axepool-icon.svg
version: "0.4.0"
tagline: Solo mine Bitcoin Cash with your Bitaxe and NerdQaxe miners
description: >-
  AxePool is a self-hosted Bitcoin Cash (BCH) solo-mining Stratum server for your own Bitcoin Cash
  Node. Point a Bitaxe, NerdQaxe or any Stratum V1 miner at it; if your hardware finds a block, the
  whole reward goes to your address. No pool, no fees, no custody.


  Set the miner's Stratum username to your BCH address (bitcoincash:q... or legacy 1..., with an
  optional .worker name) and that address is paid in the coinbase. The dashboard shows node sync, connected miners,
  hashrate, shares, best share and any blocks found.


  Requires the official Bitcoin Cash Node app, fully synced. It connects to the node automatically.
  Point miners at stratum+tcp://<your-umbrel-ip>:3344.


  Early release. Based on the MIT-licensed SoloBCH Forge by DanCreatesStuff.
releaseNotes: >-
  Each miner card now shows whether its firmware is up to date: AxeOS and NerdQaxe versions are
  compared with the latest stable release on GitHub (the same source the miner's own update page
  uses), with a link to the release notes. Check only - AxePool never updates a miner. Checked
  every 6 hours; switch it off under Settings, Miner monitoring.
