manifestVersion: 1
id: kyle-axepool-btc
category: bitcoin
name: AxePool BTC
icon: https://raw.githubusercontent.com/xmodem240/umbrel-community-app-store/main/assets/axepool-btc-icon.svg
version: "0.1.0"
tagline: Solo mine Bitcoin with your Bitaxe and NerdQaxe miners
description: >-
  AxePool BTC is a self-hosted Bitcoin (BTC) solo-mining Stratum server for your own Bitcoin node.
  Point a Bitaxe, NerdQaxe or any Stratum V1 miner at it; if your hardware finds a block, the whole
  reward goes to your address. No pool, no fees, no custody.


  Set the miner's Stratum username to your Bitcoin address (bc1q..., bc1p..., 1... or 3..., with an
  optional .worker name) and that address is paid in the coinbase. The dashboard shows node sync,
  connected miners, hashrate, shares, best share and any blocks found. The text written into a
  found block (the coinbase tag, /AxePool/ by default) can be changed in Settings.


  Works with the Bitcoin Node app or Bitcoin Knots, fully synced. It connects to the node
  automatically. Point miners at stratum+tcp://<your-umbrel-ip>:3345.


  Early release. A Bitcoin copy of AxePool (Bitcoin Cash), based on the MIT-licensed SoloBCH Forge
  by DanCreatesStuff.
releaseNotes: >-
  First release: AxePool for Bitcoin. Same dashboard, vardiff, miner monitoring, firmware check
  and alerts as AxePool, with SegWit blocks (witness commitment), bc1q/bc1p/1/3 payout addresses
  checked against the node's network, and an editable coinbase tag.
